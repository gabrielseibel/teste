name: Deploy GitHub Pages

# Publica o VERIFICA em si (site estático completo — não apenas uma página
# de apresentação) no GitHub Pages.
#
# O app roda inteiramente no navegador: o "build" abaixo é um export
# estático do Next.js (output: 'export'), e a única chamada de rede em
# tempo de uso é direta ao Supabase (URL/chave pública já versionadas em
# .env.production — protegidas por Row Level Security, somente leitura).
# Não há nenhum servidor Node.js, API route ou função serverless envolvida.
#
# Pré-requisito único (manual, uma vez): em Settings > Pages deste
# repositório, definir "Source" como "GitHub Actions".

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (export estático)
        env:
          # Nome do repositório → https://<usuário>.github.io/<repositório>/
          GITHUB_PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Marcar saída para o GitHub Pages (.nojekyll)
        # Sem isso, o GitHub Pages tenta processar a saída com Jekyll, que
        # ignora por padrão pastas começando com "_" (como a "_next" do
        # Next.js) e quebra o carregamento de CSS/JS.
        run: touch ./out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Tenta habilitar o GitHub Pages automaticamente (Source: GitHub
          # Actions) via API caso ainda não esteja habilitado. Se o token
          # usado no workflow não tiver permissão de administração do
          # repositório, este passo falha e o Pages precisa ser habilitado
          # manualmente uma vez em Settings > Pages > Source: GitHub Actions.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
