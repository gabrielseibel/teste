# Configuração de deploy no Netlify — alternativa opcional ao GitHub Pages.
#
# O VERIFICA é um site 100% estático (Next.js com output: 'export'): não há
# rotas de API nem servidor Node.js, então nenhum plugin especial é
# necessário — o Netlify só precisa publicar a pasta "out" gerada pelo build.
#
# Variáveis de ambiente (opcionais) em Site settings > Environment variables:
# NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_OCR_ENABLED.
# Sem elas, o build usa os valores públicos já versionados em .env.production
# (mesmo projeto Supabase usado no GitHub Pages).

[build]
  command = "npm run build"
  publish = "out"
